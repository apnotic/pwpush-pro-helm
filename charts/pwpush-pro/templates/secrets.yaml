{{- if not .Values.secrets.existingSecretName }}
{{- $secretName := include "pwpush-pro.fullname" . -}}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "pwpush-pro.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- if $existingSecret }}
  SECRET_KEY_BASE: {{ index $existingSecret.data "SECRET_KEY_BASE" | b64dec | quote }}
  PWPUSH_MASTER_KEY: {{ index $existingSecret.data "PWPUSH_MASTER_KEY" | b64dec | quote }}
  PWPUSH_PRIMARY_KEY: {{ index $existingSecret.data "PWPUSH_PRIMARY_KEY" | b64dec | quote }}
  PWPUSH_DETERMINISTIC_KEY: {{ index $existingSecret.data "PWPUSH_DETERMINISTIC_KEY" | b64dec | quote }}
  PWPUSH_KEY_DERIVATION_SALT: {{ index $existingSecret.data "PWPUSH_KEY_DERIVATION_SALT" | b64dec | quote }}
  {{- else }}
  SECRET_KEY_BASE: {{ printf "%s%s" (randAlphaNum 64 | sha256sum) (randAlphaNum 64 | sha256sum) | quote }}
  PWPUSH_MASTER_KEY: {{ randAlphaNum 64 | sha256sum | quote }}
  PWPUSH_PRIMARY_KEY: {{ randAlphaNum 32 | quote }}
  PWPUSH_DETERMINISTIC_KEY: {{ randAlphaNum 32 | quote }}
  PWPUSH_KEY_DERIVATION_SALT: {{ randAlphaNum 32 | quote }}
  {{- end }}

  LICENSE_KEY: {{ .Values.license.key | quote }}
  {{- if .Values.license.region }}
  LICENSE_REGION: {{ .Values.license.region | quote }}
  {{- end }}

  {{- if eq .Values.database.type "sqlite" }}
  BLAZER_DATABASE_URL: "sqlite3://storage/db/production.sqlite3"
  {{- else if eq .Values.database.type "postgresql" }}
  {{- $dbHost := include "pwpush-pro.postgresql.host" . }}
  {{- $dbPort := .Values.database.port | default 5432 }}
  {{- $dbUser := .Values.database.user | default "pwpush-pro" }}
  {{- $dbName := .Values.database.name | default "pwpush-pro" }}
  {{- $dbPassword := "" }}
  {{- if and $existingSecret (index $existingSecret.data "DB_PASSWORD") }}
  {{- $dbPassword = index $existingSecret.data "DB_PASSWORD" | b64dec }}
  {{- else if .Values.database.password }}
  {{- $dbPassword = .Values.database.password }}
  {{- else }}
  {{- $dbPassword = randAlphaNum 32 }}
  {{- end }}
  DB_PASSWORD: {{ $dbPassword | quote }}
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s:%v/%s" $dbUser $dbPassword $dbHost $dbPort $dbName | quote }}
  CACHE_DATABASE_URL: {{ printf "postgresql://%s:%s@%s:%v/%s-cache" $dbUser $dbPassword $dbHost $dbPort $dbName | quote }}
  CABLE_DATABASE_URL: {{ printf "postgresql://%s:%s@%s:%v/%s-cable" $dbUser $dbPassword $dbHost $dbPort $dbName | quote }}
  QUEUE_DATABASE_URL: {{ printf "postgresql://%s:%s@%s:%v/%s-queue" $dbUser $dbPassword $dbHost $dbPort $dbName | quote }}
  BLAZER_DATABASE_URL: {{ printf "postgresql://%s:%s@%s:%v/%s" $dbUser $dbPassword $dbHost $dbPort $dbName | quote }}
  {{- if .Values.postgresql.enabled }}
  password: {{ $dbPassword | quote }}
  postgres-password: {{ $dbPassword | quote }}
  {{- end }}
  {{- end }}

  {{- range $key, $value := .Values.extraSecretEnv }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
