# Advanced Edition - With S3 Storage Backend
#
# Usage:
#   helm install my-push pwpush-pro/pwpush-pro \
#     -f charts/pwpush-pro/values-advanced.yaml \
#     -f examples/advanced-external-storage.yaml

license:
  key: "YOUR_LICENSE_KEY"

imagePullSecrets:
  - name: regcred

# S3 storage configuration is set via environment variables
extraEnv:
  ACTIVE_STORAGE_SERVICE: s3
  AWS_ACCESS_KEY_ID: "YOUR_ACCESS_KEY"
  AWS_SECRET_ACCESS_KEY: "YOUR_SECRET_KEY"
  AWS_REGION: "us-east-1"
  AWS_BUCKET: "pwpush-pro-files"

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: push.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: push-tls
      hosts:
        - push.example.com
