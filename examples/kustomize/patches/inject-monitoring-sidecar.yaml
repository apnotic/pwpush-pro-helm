# Inject Monitoring Sidecar
#
# This patch adds a monitoring agent as a sidecar to the pwpush-pro deployment.
# Examples include Datadog Agent, New Relic, Dynatrace, or Prometheus exporters.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: pwpush-pro
spec:
  template:
    spec:
      # Add monitoring sidecar container
      containers:
        # Example 1: Datadog Agent sidecar for APM
        - name: datadog-agent
          image: datadog/agent:7
          env:
            - name: DD_APM_ENABLED
              value: "true"
            - name: DD_APM_NON_LOCAL_TRAFFIC
              value: "true"
            - name: DD_ENV
              value: "production"
            - name: DD_SERVICE
              value: "pwpush-pro"
          resources:
            limits:
              cpu: 100m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi
          volumeMounts:
            - name: datadog-sockets
              mountPath: /var/run/datadog

        # Example 2: Prometheus Node Exporter (alternative)
        # - name: prometheus-exporter
        #   image: prom/node-exporter:latest
        #   ports:
        #     - containerPort: 9100
        #       name: metrics
        #   resources:
        #     limits:
        #       cpu: 100m
        #       memory: 128Mi

        # Example 3: Fluent Bit for log shipping
        # - name: fluent-bit
        #   image: fluent/fluent-bit:latest
        #   volumeMounts:
        #     - name: varlog
        #       mountPath: /var/log
        #   resources:
        #     limits:
        #       cpu: 100m
        #       memory: 128Mi

      # Additional volumes for sidecars
      volumes:
        - name: datadog-sockets
          emptyDir: {}

        # For Fluent Bit log collection
        # - name: varlog
        #   hostPath:
        #     path: /var/log
