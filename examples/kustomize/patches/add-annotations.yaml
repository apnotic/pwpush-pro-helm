# Add Common Annotations
#
# This patch adds annotations for integration with Kubernetes ecosystem tools
# like external-dns, cert-manager, and monitoring systems.

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pwpush-pro
  annotations:
    # External DNS automatic registration
    # Requires: https://github.com/kubernetes-sigs/external-dns
    external-dns.alpha.kubernetes.io/hostname: "pwpush.example.com"
    external-dns.alpha.kubernetes.io/ttl: "300"

    # AWS ALB specific annotations (if using AWS Load Balancer Controller)
    # alb.ingress.kubernetes.io/scheme: internet-facing
    # alb.ingress.kubernetes.io/target-type: ip

    # NGINX specific annotations
    # nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    # nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
---
apiVersion: v1
kind: Service
metadata:
  name: pwpush-pro
  annotations:
    # Prometheus scraping configuration
    # prometheus.io/scrape: "true"
    # prometheus.io/port: "8080"
    # prometheus.io/path: "/metrics"

    # Datadog service tagging
    # tags.datadoghq.com/service: "pwpush-pro"
    # tags.datadoghq.com/env: "production"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pwpush-pro
  annotations:
    # Argo CD sync wave (for ordering dependencies)
    # argocd.argoproj.io/sync-wave: "2"

    # Argo CD refresh interval
    # argocd.argoproj.io/refresh: "5m"
