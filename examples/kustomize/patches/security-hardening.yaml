# Security Hardening Patches
#
# This patch applies additional security hardening to the pwpush-pro deployment.
# Use this for environments with strict security policies (government, finance, etc.)

apiVersion: apps/v1
kind: Deployment
metadata:
  name: pwpush-pro
spec:
  template:
    spec:
      # Pod-level security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
        seccompProfile:
          type: RuntimeDefault
        # For Kubernetes 1.25+ with restricted Pod Security Standard
        # sysctls:
        #   - name: net.ipv4.ip_unprivileged_port_start
        #     value: "80"

      containers:
        - name: pwpush-pro
          # Container-level security context
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true  # Makes root filesystem read-only
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL  # Drop all Linux capabilities
            seccompProfile:
              type: RuntimeDefault

          # Additional volume mounts for read-only root filesystem
          volumeMounts:
            # Mount emptyDir volumes for writable directories
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /opt/PasswordPusher/tmp
            - name: logs
              mountPath: /opt/PasswordPusher/log
            # Rails specific writable paths
            - name: rails-tmp
              mountPath: /opt/PasswordPusher/tmp/cache
            - name: pids
              mountPath: /opt/PasswordPusher/tmp/pids

      # Define emptyDir volumes for temporary writable storage
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 100Mi
        - name: cache
          emptyDir:
            sizeLimit: 100Mi
        - name: logs
          emptyDir:
            sizeLimit: 50Mi
        - name: rails-tmp
          emptyDir:
            sizeLimit: 50Mi
        - name: pids
          emptyDir:
            sizeLimit: 10Mi

      # Optional: Enable pod security policies (deprecated in K8s 1.21+)
      # Use Pod Security Standards instead

---
# Optional: Network Policy for additional isolation
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pwpush-pro
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pwpush-pro
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only allow traffic from ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 80
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
    # Allow PostgreSQL access (if using external DB)
    # - to:
    #     - podSelector:
    #         matchLabels:
    #           app.kubernetes.io/name: postgresql
    #   ports:
    #     - protocol: TCP
    #       port: 5432
    # Allow outbound HTTPS for webhooks/APIs
    - to: []
      ports:
        - protocol: TCP
          port: 443
