apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "pwpush-pro.fullname" . }}-test-connection"
  labels:
    {{- include "pwpush-pro.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
  containers:
    - name: wget
      image: busybox:1.37.0
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
      command: ['wget']
      args: ['{{ include "pwpush-pro.fullname" . }}:{{ .Values.service.port }}/up']
  restartPolicy: Never
