# Kustomize Configuration for Password Pusher Pro
#
# This example demonstrates using Kustomize as a Helm post-renderer.
# Helm renders the chart to helm-output.yaml, then Kustomize applies patches.
#
# Prerequisites:
# 1. Pre-create the pwpush-pro-secrets secret (see ARGOCD.md)
# 2. Update values.yaml with your license key and region
# 3. Make renderer.sh executable: chmod +x renderer.sh
#
# Usage:
#   helm install pwpush-pro pwpush-pro/pwpush-pro \
#     --values values.yaml \
#     --post-renderer ./renderer.sh

resources:
  # This file is generated by Helm during the post-renderer phase
  - helm-output.yaml

# Add common labels to all resources
# Useful for cost allocation, environment identification, and ownership
customLabels:
  app.kubernetes.io/managed-by: kustomize
  # Add your organizational labels here:
  # cost-center: "12345"
  # department: "engineering"
  # environment: production
  # team: security

# Add common annotations to all resources
customAnnotations:
  # Example: External DNS automatic registration
  # external-dns.alpha.kubernetes.io/hostname: "pwpush.example.com"

# Apply patches to modify resources that Helm doesn't expose via values
patches:
  # Uncomment the patches you want to apply:

  # Add organizational labels to specific resources
  # - path: patches/add-labels.yaml

  # Add annotations for external-dns or cert-manager
  # - path: patches/add-annotations.yaml

  # Override resource limits beyond what values.yaml exposes
  # - path: patches/custom-resource-limits.yaml

  # Inject a monitoring sidecar (Datadog, New Relic, etc.)
  # - path: patches/inject-monitoring-sidecar.yaml

  # Add security hardening patches
  # - path: patches/security-hardening.yaml

  # Add network policies
  # - path: patches/network-policy.yaml
